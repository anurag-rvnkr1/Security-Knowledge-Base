  </g>
  <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)">
    <path d="M255 80h78"/><path d="M560 80h78"/>
    <path d="M755 115v52H210v48"/><path d="M755 115v52H450v48"/><path d="M755 115v52H690v48"/>
