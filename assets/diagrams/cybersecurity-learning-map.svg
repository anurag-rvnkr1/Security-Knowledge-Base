  <rect width="900" height="350" rx="18" fill="#f8fafc"/>
  <g font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="700">
    <rect x="35" y="45" width="220" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="145" y="75">Foundations</text><text x="145" y="96" font-size="11" font-weight="400">Networking · Linux · Windows</text>
    <rect x="340" y="45" width="220" height="70" rx="12" fill="#e0e7ff" stroke="#4f46e5"/><text x="450" y="75">Security Engineering</text><text x="450" y="96" font-size="11" font-weight="400">Identity · Cloud · AppSec</text>
