name: Validate handbook

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated indexes
        run: python scripts/build-content-index.py --check
      - name: Validate Markdown, links, and resources
        run: python scripts/validate-knowledge-base.py
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
