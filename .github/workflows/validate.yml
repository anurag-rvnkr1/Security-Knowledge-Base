name: Validate knowledge base

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate catalogue and search index
        run: python scripts/build-content-index.py

      - name: Confirm generated output is committed and reproducible
        run: |
          git ls-files --error-unmatch site/content.json site/search-index.json
          git diff --exit-code HEAD -- site/content.json site/search-index.json
          python scripts/build-content-index.py --check

      - name: Validate repository content
        run: python scripts/validate-knowledge-base.py

      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
